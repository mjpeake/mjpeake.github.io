<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}"
    dir="{{ or site.Language.LanguageDirection `ltr` }}">

<head>
{{ partial "head.html" . }}
</head>

<body>
    <main>
        <div class="body-404">
            {{- $logo := resources.Get "images/icons/logo.svg" }}
            <div class="logo-404"><a href="{{ .Site.BaseURL }}" aria-label="Matt Peake home"><span class="logo-mark" style="--logo-url: url('{{ $logo.RelPermalink }}');" aria-hidden="true"></span></a></div>
            <div class="text-404">404</div>
            <div class="subtext-404">PAGE NOT FOUND</div>
        </div>
    </main>
</body>

</html>
