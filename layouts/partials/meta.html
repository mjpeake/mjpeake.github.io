  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{- $defaultDescription := "Matt Peake - Software Engineer portfolio with interactive projects and generative art." }}
  {{- $description := or .Description .Params.description $defaultDescription }}
  {{- $title := cond .IsHome site.Title (printf "%s | %s" .Title site.Title) }}
  <meta name="description" content="{{ $description }}">
  <title>{{ $title }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ $title }}">
  <meta property="og:description" content="{{ $description }}">
  <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ $title }}">
  <meta name="twitter:description" content="{{ $description }}">
  <script>
    (function () {
      var storageKey = "theme";
      var theme = "light";

      try {
        var storedTheme = window.localStorage.getItem(storageKey);
        if (storedTheme === "light" || storedTheme === "dark") {
          theme = storedTheme;
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }
      } catch (error) {
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }
      }

      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon/ridgeline.svg?v=3">
  <meta name="theme-color" content="#FAFAFA">
