<div class="page-title-bar">
  {{ if eq .Section "gallery" }}
  <div class="page-icon" aria-hidden="true"><i class="fas fa-image"></i></div>
  {{ else if eq .Section "projects" }}
  <div class="page-icon" aria-hidden="true"><i class="fas fa-code"></i></div>
  {{ else }}
  {{ with .Resources.GetMatch "icon.svg" }}
  <div class="page-icon" aria-hidden="true">{{ .Content | safeHTML }}</div>
  {{ end }}
  {{ end }}
  <div class="page-title"><h1>{{ .Title }}</h1></div>
</div>
